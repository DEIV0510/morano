# Integración continua: compilación, tipos, pruebas y auditoría de dependencias.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # auditoría semanal de vulnerabilidades (lunes)
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      APP_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      DATABASE_URL: file:data/ci.db
      SITE_URL: http://localhost:4321
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx astro check
      - run: npm run build
      - run: npm test
      - run: node --test tests/api/stripe-webhook.test.mjs
      - name: Pruebas de seguridad HTTP contra la compilación
        run: |
          npm run db:migrate
          PORT=4321 HOST=localhost node server.mjs &
          sleep 3
          TEST_BASE_URL=http://localhost:4321 node --test --test-concurrency=1 tests/api/http-security.test.mjs
